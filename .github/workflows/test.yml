name: PowerShell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows PowerShell and PowerShell 7
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test with Windows PowerShell
        shell: powershell
        run: .\tests\Test-IdentifyHash.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: .\tests\Test-IdentifyHash.ps1
